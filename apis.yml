apis:
- aid: vault:vault-api
  name: Vault HTTP API
  description: >-
    The complete Vault HTTP API gives full access to all Vault operations via REST. Includes authentication
    method APIs (AppRole, LDAP, JWT, Kubernetes, AWS, Azure), secrets engine APIs (Database, AWS, PKI,
    SSH, Transit), and the system backend. The OpenAPI spec is dynamically generated from a running Vault
    instance at /v1/sys/internal/specs/openapi.
  humanURL: https://developer.hashicorp.com/vault/api-docs
  baseURL: https://vault.example.com/v1
  tags:
  - Auth Methods
