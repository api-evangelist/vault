aid: vault
name: HashiCorp Vault
description: >-
  HashiCorp Vault is an open source tool for securely storing and accessing secrets. A secret is anything you want to
  tightly control access to, such as API keys, passwords, certificates, and more. Vault provides a unified interface to
  any secret while providing tight access control via policies and recording a detailed audit log. It supports dynamic
  secrets, data encryption, PKI, SSH certificate issuance, and identity-based access through a comprehensive REST HTTP
  API.
