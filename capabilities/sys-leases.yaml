naftiko: 1.0.0-alpha2
info:
  label: HashiCorp Vault System Backend API — Leases
  description: 'HashiCorp Vault System Backend API — Leases. 3 operations. Lead operation: HashiCorp Vault Lookup Lease. Self-contained
    Naftiko capability covering one Vault business surface.'
  tags:
  - Vault
  - Leases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VAULT_API_KEY: VAULT_API_KEY
capability:
  consumes:
  - type: http
    namespace: sys-leases
    baseUri: https://vault.example.com/v1
    description: HashiCorp Vault System Backend API — Leases business capability. Self-contained, no shared references.
    resources:
    - name: sys-leases-lookup
      path: /sys/leases/lookup
      operations:
      - name: lookuplease
        method: PUT
        description: HashiCorp Vault Lookup Lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sys-leases-renew
      path: /sys/leases/renew
      operations:
      - name: renewlease
        method: PUT
        description: HashiCorp Vault Renew Lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sys-leases-revoke
      path: /sys/leases/revoke
      operations:
      - name: revokelease
        method: PUT
        description: HashiCorp Vault Revoke Lease
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Vault-Token
      value: '{{env.VAULT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sys-leases-rest
    port: 8080
    description: REST adapter for HashiCorp Vault System Backend API — Leases. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/sys/leases/lookup
      name: sys-leases-lookup
      description: REST surface for sys-leases-lookup.
      operations:
      - method: PUT
        name: lookuplease
        description: HashiCorp Vault Lookup Lease
        call: sys-leases.lookuplease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sys/leases/renew
      name: sys-leases-renew
      description: REST surface for sys-leases-renew.
      operations:
      - method: PUT
        name: renewlease
        description: HashiCorp Vault Renew Lease
        call: sys-leases.renewlease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sys/leases/revoke
      name: sys-leases-revoke
      description: REST surface for sys-leases-revoke.
      operations:
      - method: PUT
        name: revokelease
        description: HashiCorp Vault Revoke Lease
        call: sys-leases.revokelease
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sys-leases-mcp
    port: 9090
    transport: http
    description: MCP adapter for HashiCorp Vault System Backend API — Leases. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: hashicorp-vault-lookup-lease
      description: HashiCorp Vault Lookup Lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sys-leases.lookuplease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: hashicorp-vault-renew-lease
      description: HashiCorp Vault Renew Lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sys-leases.renewlease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: hashicorp-vault-revoke-lease
      description: HashiCorp Vault Revoke Lease
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: sys-leases.revokelease
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
